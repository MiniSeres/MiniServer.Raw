<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniServer</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#0a0e17;--bg2:#111827;--bg3:#1a2332;--bg4:#0f1729;--text:#e2e8f0;--text2:#7a8aaa;--border:#1a2a40;--accent:#4facfe;--green:#34d399;--red:#f87171;--purple:#a78bfa;--radius:8px;--font:-apple-system,system-ui,sans-serif;--mono:SF Mono,Fira Code,Courier New,monospace}
        body{background:var(--bg);color:var(--text);font-family:var(--font);padding:20px;min-height:100vh}
        .app{max-width:900px;margin:0 auto;background:var(--bg2);border-radius:var(--radius);padding:24px;border:1px solid var(--border)}
        .header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
        .logo{font-size:20px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .logo small{font-size:11px;color:var(--text2);-webkit-text-fill-color:var(--text2);margin-left:4px}
        .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
        .field{flex:1;min-width:120px;background:var(--bg4);border:1px solid var(--border);border-radius:6px;padding:4px 10px;display:flex;align-items:center;gap:4px}
        .field input{background:transparent;border:none;color:var(--text);font-size:13px;padding:4px 0;outline:none;width:100%;font-family:var(--mono)}
        .field input::placeholder{color:var(--text2)}
        .field label{color:var(--text2);font-size:9px;font-weight:600;text-transform:uppercase}
        .btn{padding:6px 14px;border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;font-family:var(--font)}
        .btn-primary{background:linear-gradient(135deg,#10b981,#34d399);color:#0a0e17}
        .btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(16,185,129,0.2)}
        .btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
        .btn-secondary:hover{background:var(--border)}
        .btn-file{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#0a0e17}
        .btn-file:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(245,158,11,0.2)}
        .btn-purple{background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff}
        .btn-purple:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(124,58,237,0.2)}
        .btn-danger{background:linear-gradient(135deg,#ef4444,#f87171);color:#fff}
        .btn-danger:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(239,68,68,0.2)}
        textarea{width:100%;min-height:400px;background:var(--bg4);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:12px 14px;font-family:var(--mono);font-size:13px;line-height:1.7;resize:vertical;outline:none}
        textarea:focus{border-color:var(--accent)}
        .actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
        .hint{margin-top:10px;color:var(--text2);font-size:10px;display:flex;flex-wrap:wrap;gap:10px}
        .hint kbd{background:var(--bg3);padding:0 6px;border-radius:3px;border:1px solid var(--border);font-size:9px;font-family:var(--mono)}
        .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:10px 20px;color:var(--text);font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,0.5);z-index:999;display:none;max-width:90%;text-align:center}
        .toast.show{display:block}
        .toast.success{border-left:3px solid var(--green)}
        .toast.error{border-left:3px solid var(--red)}
        .toast.info{border-left:3px solid var(--accent)}
        .list-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}
        .list-item:last-child{border-bottom:none}
        .list-item .name{color:var(--accent);font-family:var(--mono);font-size:13px;cursor:pointer}
        .list-item .name:hover{text-decoration:underline}
        .list-item .info{color:var(--text2);font-size:10px}
        .list-item .actions{display:flex;gap:4px;margin-top:0}
        .list-item .actions button{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:2px 8px;border-radius:4px;font-size:9px;cursor:pointer}
        .list-item .actions button:hover{background:var(--border)}
        .empty{text-align:center;padding:40px 20px;color:var(--text2)}
        .empty .icon{font-size:40px;margin-bottom:10px}
        .empty h3{color:var(--text);font-size:16px}
        .empty p{font-size:13px}
        .note-box{background:rgba(79,172,254,0.05);border:1px solid rgba(79,172,254,0.08);border-radius:6px;padding:8px 12px;margin-bottom:12px;display:flex;align-items:flex-start;gap:8px;color:var(--text2);font-size:11px}
        .note-box .icon{font-size:16px;flex-shrink:0}
        .note-box strong{color:var(--accent)}
        .result-box{margin-top:10px;padding:10px 14px;background:var(--bg4);border-radius:6px;border-left:3px solid var(--green);display:none;word-break:break-all;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
        .result-box.show{display:flex}
        .result-box .link{color:var(--accent);text-decoration:none;font-weight:600;font-size:12px}
        .result-box .copy-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:2px 12px;border-radius:4px;font-size:10px;cursor:pointer}
        .result-box .copy-btn:hover{background:var(--border)}
        .pre-wrap{background:var(--bg4);padding:12px 14px;font-family:var(--mono);font-size:12px;line-height:1.7;white-space:pre-wrap;word-wrap:break-word;min-height:200px;margin:0;color:var(--text);border-radius:6px}
        @media(max-width:640px){.app{padding:16px}textarea{min-height:250px;font-size:12px;padding:10px}.toolbar{flex-direction:column}.field{width:100%}.btn{width:100%;justify-content:center;padding:8px}}
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
        (function() {
            var hash = window.location.hash.slice(1);
            var parts = hash.split('/').filter(function(p) { return p.length > 0; });
            var mode = parts[0] || '';
            var id = parts[1] || '';

            if (mode === 'raw' && id) {
                renderRaw(id);
                return;
            }

            if (mode === 'all') {
                renderAll();
                return;
            }

            if (id) {
                renderView(id);
                return;
            }

            renderHome();

            function genId(len) {
                var c = 'abcdefghijklmnopqrstuvwxyz0123456789';
                var r = '';
                for (var i = 0; i < len; i++) r += c[Math.floor(Math.random() * c.length)];
                return r;
            }

            function esc(t) {
                var d = document.createElement('div');
                d.textContent = t;
                return d.innerHTML;
            }

            function isValidId(id) {
                return /^[a-zA-Z0-9_\-\.\/\[\]\(\)]+$/.test(id);
            }

            function copyText(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).catch(function() { fallbackCopy(text); });
                } else {
                    fallbackCopy(text);
                }
            }

            function fallbackCopy(text) {
                var i = document.createElement('input');
                i.value = text;
                document.body.appendChild(i);
                i.select();
                document.execCommand('copy');
                document.body.removeChild(i);
            }

            function downloadFile(id, content) {
                var blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = id + '.txt';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            function saveToStorage(id, content) {
                localStorage.setItem('ms_' + id, content);
                return true;
            }

            function loadFromStorage(id) {
                return localStorage.getItem('ms_' + id) || null;
            }

            function deleteFromStorage(id) {
                localStorage.removeItem('ms_' + id);
                return true;
            }

            function existsInStorage(id) {
                return localStorage.getItem('ms_' + id) !== null;
            }

            function showToast(msg, type) {
                type = type || 'info';
                var t = document.getElementById('toast');
                if (!t) {
                    t = document.createElement('div');
                    t.id = 'toast';
                    t.className = 'toast';
                    t.innerHTML = '<span id="toastMsg"></span>';
                    document.body.appendChild(t);
                }
                var msgEl = document.getElementById('toastMsg');
                if (msgEl) msgEl.textContent = msg;
                t.className = 'toast ' + type;
                t.classList.add('show');
                clearTimeout(t._timer);
                t._timer = setTimeout(function() {
                    t.classList.remove('show');
                }, 2500);
            }

            function renderRaw(id) {
                var data = loadFromStorage(id);
                var content = data !== null ? data : 'Not found';
                document.documentElement.innerHTML = '<pre style="margin:0;padding:20px;font-family:Courier New,monospace;font-size:7px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;min-height:100vh;">' + esc(content) + '</pre>';
            }

            function renderAll() {
                var files = [];
                for (var i = 0; i < localStorage.length; i++) {
                    var key = localStorage.key(i);
                    if (key && key.startsWith('ms_')) {
                        files.push(key.slice(3));
                    }
                }

                var html = '';
                html += '<div class="app">';
                html += '<div class="header"><div class="logo">MS <small>all files</small></div><a href="/" class="btn btn-secondary" style="text-decoration:none;padding:3px 10px;font-size:9px;">+ New</a></div>';

                if (files.length === 0) {
                    html += '<div class="empty"><div class="icon">📭</div><h3>No files</h3><p>Create your first paste</p></div>';
                } else {
                    html += '<div style="margin-top:10px;padding:8px 12px;background:var(--bg4);border-radius:6px;border:1px solid var(--border);">';
                    for (var i = 0; i < files.length; i++) {
                        var f = files[i];
                        var data = loadFromStorage(f);
                        var size = data ? data.length : 0;
                        html += '<div class="list-item">';
                        html += '<span class="name" onclick="window.location.hash=\'/\' + \'' + f + '\'">' + f + '</span>';
                        html += '<span class="info">' + size + ' chars</span>';
                        html += '<div class="actions">';
                        html += '<button onclick="window.location.hash=\'/\' + \'' + f + '\'">View</button>';
                        html += '<button onclick="window.location.hash=\'/raw/\' + \'' + f + '\'">Raw</button>';
                        html += '</div></div>';
                    }
                    html += '</div>';
                }
                html += '</div>';
                document.getElementById('app').innerHTML = html;
            }

            function renderView(id) {
                var data = loadFromStorage(id);
                if (data === null) {
                    document.getElementById('app').innerHTML =
                        '<div class="app" style="text-align:center;padding:60px 20px;"><h1 style="font-size:48px;color:var(--text2);">404</h1><p style="color:var(--text2);font-size:15px;">Not found: <code>' +
                        id + '</code></p><a href="/" style="color:var(--accent);text-decoration:none;font-size:14px;margin-top:10px;display:inline-block;">← Home</a></div>';
                    return;
                }

                var html = '';
                html += '<div class="app">';
                html += '<div class="header">';
                html += '<div class="logo">MS <small>' + id + '</small></div>';
                html += '<div style="display:flex;gap:4px;align-items:center;">';
                html += '<span style="font-size:9px;background:var(--bg3);padding:2px 8px;border-radius:12px;color:var(--text2);border:1px solid var(--border);">' + data.length + ' chars</span>';
                html += '<a href="#/all" class="btn btn-secondary" style="text-decoration:none;padding:3px 8px;font-size:9px;">All</a>';
                html += '</div></div>';

                html += '<div style="margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--bg4);padding:6px 10px;border-radius:6px;border:1px solid var(--border);">';
                html += '<span style="color:var(--text2);font-size:9px;">Raw link:</span>';
                html += '<code style="color:var(--accent);font-size:10px;word-break:break-all;font-family:var(--mono);">' + window.location.href.split('#')[0] + '#/raw/' + id + '</code>';
                html += '<button onclick="copyText(\'' + window.location.href.split('#')[0] + '#/raw/' + id + '\')" style="background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:2px 8px;border-radius:4px;font-size:9px;cursor:pointer;margin-left:auto;">Copy</button>';
                html += '<a href="#/raw/' + id + '" style="background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:2px 8px;border-radius:4px;font-size:9px;text-decoration:none;">Open</a>';
                html += '</div>';

                html += '<pre class="pre-wrap">' + esc(data) + '</pre>';

                html += '<div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;">';
                html += '<a href="/" class="btn btn-primary" style="text-decoration:none;">+ New</a>';
                html += '<button onclick="copyText(document.querySelector(\'.pre-wrap\').textContent)" class="btn btn-secondary">Copy</button>';
                html += '<button onclick="downloadFile(\'' + id + '\', document.querySelector(\'.pre-wrap\').textContent)" class="btn btn-purple">Download</button>';
                html += '<button onclick="if(confirm(\'Delete?\')){deleteFromStorage(\'' + id + '\');window.location.hash=\'/all\'}" class="btn btn-danger">Delete</button>';
                html += '</div>';
                html += '</div>';

                document.getElementById('app').innerHTML = html;
            }

            function renderHome() {
                var html = '';
                html += '<div class="app">';
                html += '<div class="header">';
                html += '<div class="logo">MS <small>create</small></div>';
                html += '<a href="#/all" class="btn btn-secondary" style="text-decoration:none;padding:3px 10px;font-size:9px;">All files</a>';
                html += '</div>';

                html += '<div class="note-box"><span class="icon">⚡</span><div><strong>Note:</strong> Data in localStorage. Clear browser = lose all.<br>Raw link: <kbd style="background:var(--bg3);padding:0 4px;border-radius:2px;border:1px solid var(--border);font-size:9px;font-family:var(--mono);color:var(--text2);">#/raw/name</kbd> - only text, size 50%</div></div>';

                html += '<div class="toolbar">';
                html += '<div class="field"><label>ID</label><input type="text" id="customId" placeholder="Auto 10-12 chars" /></div>';
                html += '<div class="field" style="flex:0 0 auto;min-width:0;"><button class="btn btn-secondary" id="randomBtn" style="padding:2px 10px;font-size:9px;">Random</button></div>';
                html += '<div class="field" style="flex:0 0 auto;min-width:0;"><button class="btn btn-file" id="pasteFileBtn" style="padding:2px 10px;font-size:9px;">📂 Paste file</button></div>';
                html += '</div>';

                html += '<textarea id="pasteContent" placeholder="Paste code, text, HTML, JS, CSS..."></textarea>';

                html += '<div class="actions">';
                html += '<button class="btn btn-primary" id="saveBtn">Create</button>';
                html += '<button class="btn btn-secondary" id="clearBtn">Clear</button>';
                html += '<button class="btn btn-purple" id="downloadBtn">Download</button>';
                html += '</div>';

                html += '<div class="result-box" id="resultBox">';
                html += '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;"><span style="color:var(--text2);font-size:11px;">Link:</span><a href="#" class="link" id="resultLink" target="_blank"></a></div>';
                html += '<button class="copy-btn" id="copyBtn">Copy</button>';
                html += '</div>';

                html += '<div class="hint">';
                html += '<span><kbd>Ctrl+S</kbd> Save</span>';
                html += '<span>Raw: <kbd>#/raw/name</kbd></span>';
                html += '</div>';
                html += '</div>';

                document.getElementById('app').innerHTML = html;

                var textarea = document.getElementById('pasteContent');
                var customId = document.getElementById('customId');
                var saveBtn = document.getElementById('saveBtn');
                var clearBtn = document.getElementById('clearBtn');
                var randomBtn = document.getElementById('randomBtn');
                var downloadBtn = document.getElementById('downloadBtn');
                var pasteFileBtn = document.getElementById('pasteFileBtn');
                var resultBox = document.getElementById('resultBox');
                var resultLink = document.getElementById('resultLink');
                var copyBtn = document.getElementById('copyBtn');

                randomBtn.addEventListener('click', function() {
                    customId.value = genId(10 + Math.floor(Math.random() * 3));
                });

                pasteFileBtn.addEventListener('click', function() {
                    var input = document.createElement('input');
                    input.type = 'file';
                    input.accept = '.txt,.js,.html,.css,.json,.py,.go,.php,.sql,.md,.csv,.xml,.yml,.yaml,.log,.sh,.bat,.ps1';
                    input.multiple = false;
                    input.style.display = 'none';
                    document.body.appendChild(input);
                    input.addEventListener('change', function(e) {
                        var file = e.target.files[0];
                        if (!file) {
                            document.body.removeChild(input);
                            return;
                        }
                        var reader = new FileReader();
                        reader.onload = function(event) {
                            textarea.value = event.target.result;
                            textarea.dispatchEvent(new Event('input'));
                            showToast('📂 Pasted: ' + file.name, 'success');
                            document.body.removeChild(input);
                        };
                reader.onerror = function() {
                            showToast('Error reading file', 'error');
                            document.body.removeChild(input);
                        };
                        reader.readAsText(file);
                    });
                    input.click();
                });

                clearBtn.addEventListener('click', function() {
                    if (textarea.value) {
                        if (confirm('Clear all?')) {
                            textarea.value = '';
                            resultBox.classList.remove('show');
                            showToast('Cleared', 'info');
                        }
                    }
                });

                downloadBtn.addEventListener('click', function() {
                    var content = textarea.value;
                    if (!content.trim()) {
                        showToast('No content to download', 'error');
                        return;
                    }
                    var id = customId.value.trim() || genId(10 + Math.floor(Math.random() * 3));
                    downloadFile(id, content);
                    showToast('Downloaded: ' + id + '.txt', 'success');
                });

                function savePaste() {
                    var content = textarea.value;
                    if (!content.trim()) {
                        showToast('Please enter content', 'error');
                        textarea.focus();
                        return;
                    }

                    var id = customId.value.trim();
                    if (!id) {
                        id = genId(10 + Math.floor(Math.random() * 3));
                    } else {
                        if (!isValidId(id)) {
                            showToast('Invalid characters', 'error');
                            customId.focus();
                            return;
                        }
                    }

                    if (existsInStorage(id)) {
                        showToast('ID "' + id + '" already exists!', 'error');
                        customId.focus();
                        customId.select();
                        return;
                    }

                    saveToStorage(id, content);
                    var baseUrl = window.location.href.split('#')[0];
                    var rawUrl = baseUrl + '#/raw/' + id;

                    resultLink.href = rawUrl;
                    resultLink.textContent = rawUrl;
                    resultBox.classList.add('show');

                    copyText(rawUrl);
                    copyBtn.textContent = 'Copied!';
                    setTimeout(function() { copyBtn.textContent = 'Copy'; }, 1500);

                    customId.value = id;
                    customId.select();
                    showToast('Created: ' + id, 'success');
                }

                saveBtn.addEventListener('click', savePaste);

                document.addEventListener('keydown', function(e) {
                    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                        e.preventDefault();
                        savePaste();
                    }
                });

                copyBtn.addEventListener('click', function() {
                    if (!resultLink.href) return;
                    copyText(resultLink.href);
                    copyBtn.textContent = 'Copied!';
                    setTimeout(function() { copyBtn.textContent = 'Copy'; }, 1500);
                });

                customId.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') savePaste();
                });

                textarea.addEventListener('keydown', function(e) {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                        e.preventDefault();
                        savePaste();
                    }
                });
            }

            console.log('MiniServer ready');
            console.log('Raw: #/raw/name - only text, size 50%');
            console.log('All files: #/all');
        })();
    </script>
</body>
</html>
