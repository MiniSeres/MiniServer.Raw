<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Raw Script Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: #0d1117;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 30px 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: #161b22;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            border: 1px solid #30363d;
        }

        h1 {
            color: #f0f6fc;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h1 small {
            font-size: 14px;
            font-weight: 400;
            color: #8b949e;
        }

        .url-bar {
            background: #0d1117;
            border-radius: 12px;
            padding: 14px 18px;
            margin: 18px 0 25px 0;
            border: 1px solid #30363d;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .url-bar label {
            color: #8b949e;
            font-weight: 500;
            font-size: 14px;
        }
        .url-bar input {
            flex: 1;
            background: transparent;
            border: none;
            color: #58a6ff;
            font-size: 15px;
            outline: none;
            min-width: 180px;
            padding: 4px 0;
        }
        .url-bar input::placeholder {
            color: #484f58;
        }
        .url-bar .badge {
            background: #21262d;
            padding: 4px 14px;
            border-radius: 40px;
            color: #c9d1d9;
            font-size: 13px;
            border: 1px solid #30363d;
        }

        .flex-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .flex-row > div {
            flex: 1;
            min-width: 200px;
        }

        label {
            display: block;
            color: #c9d1d9;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
        }
        input[type="text"], textarea {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 12px 14px;
            color: #e6edf3;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        input[type="text"]:focus, textarea:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88,166,255,0.15);
        }
        textarea {
            min-height: 130px;
            resize: vertical;
            font-family: 'Fira Code', 'Consolas', monospace;
            line-height: 1.6;
            tab-size: 2;
        }

        .preview-box {
            background: #0d1117;
            border-radius: 12px;
            border: 1px solid #30363d;
            padding: 16px 18px;
            margin-top: 20px;
        }
        .preview-box .head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #8b949e;
            font-size: 13px;
            margin-bottom: 10px;
            border-bottom: 1px dashed #21262d;
            padding-bottom: 8px;
        }
        .preview-box .head span {
            background: #21262d;
            padding: 0 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #c9d1d9;
        }

        #previewContent {
            color: #e6edf3;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 360px;
            overflow-y: auto;
            padding: 4px 0;
        }

        .line-hash {
            color: #ff6b6b !important;
        }
        .line-dash {
            color: #7ec8e3 !important;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 16px 0 6px 0;
        }
        .btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary {
            background: #238636;
            border-color: #238636;
            color: white;
        }
        .btn-primary:hover {
            background: #2ea043;
        }
        .btn-outline {
            background: transparent;
            border-color: #58a6ff;
            color: #58a6ff;
        }
        .btn-outline:hover {
            background: #1f2937;
        }
        .btn-danger {
            border-color: #da3633;
            color: #da3633;
            background: transparent;
        }
        .btn-danger:hover {
            background: #2d1b1b;
        }

        .toast {
            background: #21262d;
            color: #c9d1d9;
            padding: 10px 20px;
            border-radius: 40px;
            border-left: 4px solid #58a6ff;
            margin-top: 12px;
            font-size: 14px;
            display: none;
        }
        .toast.show {
            display: block;
        }

        @media (max-width: 600px) {
            .container { padding: 18px; }
            .url-bar { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>
        ⚡ Raw Script
        <small>· link rút gọn</small>
    </h1>

    <div class="url-bar">
        <label>🔗 Raw Link</label>
        <input type="text" id="rawLinkInput" placeholder="domain.com/main/raw/..." value="mycdn.com/main/raw/script01" />
        <span class="badge">/main/raw/</span>
    </div>

    <div class="flex-row">
        <div>
            <label>📛 Đặt tên (name)</label>
            <input type="text" id="scriptName" placeholder="ví dụ: script01" value="my_script" />
        </div>
        <div>
            <label>📂 Paste từ tệp</label>
            <input type="text" id="filePaste" placeholder="dán nội dung tệp vào đây..." />
        </div>
    </div>

    <label>✏️ Viết code hoặc prompt</label>
    <textarea id="codeArea" placeholder="Viết code, prompt hoặc dán nội dung...&#10;Dòng bắt đầu bằng # → đỏ&#10;Dòng bắt đầu bằng - hoặc • → xanh biển nhạt"># Dòng này sẽ có màu đỏ
- Dòng này sẽ xanh biển nhạt
• Dòng này cũng xanh biển nhạt
Đây là dòng bình thường
# Cảnh báo quan trọng
- Bước 1: chuẩn bị
• Bước 2: thực thi</textarea>

    <div class="action-buttons">
        <button class="btn btn-primary" id="renderBtn">▶ Render</button>
        <button class="btn btn-outline" id="copyBtn">📋 Copy preview</button>
        <button class="btn btn-danger" id="clearBtn">✖ Clear</button>
    </div>

    <div class="preview-box">
        <div class="head">
            <span>👁️ Preview</span>
            <span id="lineCount">0 dòng</span>
        </div>
        <div id="previewContent">✨ Nhấn <strong>Render</strong> để hiển thị</div>
    </div>

    <div id="toast" class="toast">✅ Đã cập nhật</div>
</div>

<script>
    (function() {
        const rawLinkInput = document.getElementById('rawLinkInput');
        const scriptName = document.getElementById('scriptName');
        const filePaste = document.getElementById('filePaste');
        const codeArea = document.getElementById('codeArea');
        const previewContent = document.getElementById('previewContent');
        const lineCount = document.getElementById('lineCount');
        const toast = document.getElementById('toast');

        const renderBtn = document.getElementById('renderBtn');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');

        function renderPreview(text) {
            if (!text || text.trim() === '') {
                return '<span style="color:#8b949e;">⏺ (trống)</span>';
            }

            const lines = text.split('\n');
            let html = '';
            let count = 0;

            for (let raw of lines) {
                const line = raw;
                count++;

                const trimmed = line.trimStart();
                let className = '';

                if (trimmed.startsWith('#')) {
                    className = 'line-hash';
                } else if (trimmed.startsWith('-') || trimmed.startsWith('•')) {
                    className = 'line-dash';
                }

                const safe = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                if (className) {
                    html += `<div class="${className}">${safe}</div>`;
                } else {
                    html += `<div>${safe}</div>`;
                }
            }

            lineCount.textContent = count + ' dòng';
            return html;
        }

        function updatePreview() {
            const rawLink = rawLinkInput.value.trim() || '(chưa có link)';
            const name = scriptName.value.trim() || '(chưa đặt tên)';
            const paste = filePaste.value.trim();
            let code = codeArea.value;

            if (paste) {
                code = paste;
                codeArea.value = paste;
            }

            const header = `🔗 ${rawLink}  |  📛 ${name}\n${'-'.repeat(40)}\n`;
            const fullContent = header + code;

            const rendered = renderPreview(fullContent);
            previewContent.innerHTML = rendered;

            toast.textContent = '✅ Đã render ' + new Date().toLocaleTimeString();
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function copyPreview() {
            const raw = previewContent.innerText || previewContent.textContent;
            if (!raw || raw.includes('Nhấn Render')) {
                toast.textContent = '⚠️ Chưa có nội dung để copy';
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 1800);
                return;
            }
            navigator.clipboard.writeText(raw).then(() => {
                toast.textContent = '📋 Đã copy preview!';
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 1800);
            }).catch(() => {
                const area = document.createElement('textarea');
                area.value = raw;
                document.body.appendChild(area);
                area.select();
                document.execCommand('copy');
                area.remove();
                toast.textContent = '📋 Copy thành công (fallback)';
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 1800);
            });
        }

        function clearAll() {
            rawLinkInput.value = '';
            scriptName.value = '';
            filePaste.value = '';
            codeArea.value = '';
            previewContent.innerHTML = '<span style="color:#8b949e;">🧹 Đã xóa</span>';
            lineCount.textContent = '0 dòng';
            toast.textContent = '🧹 Đã clear';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1500);
        }

        renderBtn.addEventListener('click', updatePreview);
        copyBtn.addEventListener('click', copyPreview);
        clearBtn.addEventListener('click', clearAll);

        let debounceTimer;
        function autoRender() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(updatePreview, 350);
        }

        filePaste.addEventListener('input', function() {
            codeArea.value = this.value;
            autoRender();
        });

        codeArea.addEventListener('input', autoRender);
        rawLinkInput.addEventListener('input', autoRender);
        scriptName.addEventListener('input', autoRender);

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(updatePreview, 100);
        });

        filePaste.addEventListener('paste', function(e) {
            setTimeout(() => {
                codeArea.value = this.value;
                autoRender();
            }, 50);
        });

    })();
</script>

</body>
  </html>
