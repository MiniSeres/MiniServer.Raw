<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RawScript · Pastefy Clone</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#c9d1d9;--accent:#58a6ff;--accent-hover:#1f6feb;--radius:12px}
body{background:var(--bg);color:var(--text);min-height:100vh;padding:20px;display:flex;justify-content:center;align-items:center}
.app{max-width:900px;width:100%;background:var(--surface);border-radius:var(--radius);padding:32px;border:1px solid var(--border)}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;flex-wrap:wrap;gap:12px}
.logo h1{font-size:26px;font-weight:700;background:linear-gradient(135deg,var(--accent),#a371f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo small{font-size:13px;color:#8b949e;-webkit-text-fill-color:#8b949e}
.btn{padding:10px 22px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s;background:var(--border);color:var(--text)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-success{background:#2ea043;color:#fff}
.btn-success:hover{background:#2c974b}
.btn-danger{background:#da3633;color:#fff}
.btn-danger:hover{background:#f85149}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:#8b949e}
.form-group input,.form-group textarea{width:100%;padding:12px 16px;border-radius:8px;border:1px solid var(--border);background:#0d1117;color:var(--text);font-size:14px;outline:none;transition:border 0.2s}
.form-group input:focus,.form-group textarea:focus{border-color:var(--accent)}
.form-group textarea{min-height:200px;font-family:Consolas,Monaco,monospace;font-size:13px;resize:vertical}
.form-row{display:flex;gap:12px;flex-wrap:wrap}
.form-row .form-group{flex:1;min-width:180px}
.upload-area{border:2px dashed var(--border);border-radius:8px;padding:30px;text-align:center;cursor:pointer;transition:all 0.2s;margin-bottom:18px}
.upload-area:hover{border-color:var(--accent);background:rgba(88,166,255,0.05)}
.upload-area.dragover{border-color:var(--accent);background:rgba(88,166,255,0.1)}
.result-box{margin-top:20px;padding:16px;background:#0d1117;border-radius:8px;border:1px solid var(--border);display:none}
.result-box.active{display:block}
.result-box .link{display:flex;gap:10px;align-items:center;margin-top:8px}
.result-box .link input{flex:1;padding:10px 14px;border-radius:6px;border:1px solid var(--border);background:#161b22;color:var(--text);font-size:13px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#161b22;border:1px solid var(--border);padding:14px 28px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:all 0.3s;z-index:999}
.toast.show{opacity:1}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.6s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){.app{padding:16px}.header{flex-direction:column;align-items:stretch}.form-row{flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<div class="header">
<div class="logo"><h1>⎚ RawScript <small>· pastefy clone</small></h1></div>
<div>
<button class="btn btn-outline" id="themeToggle">🌓</button>
</div>
</div>

<div class="upload-area" id="uploadArea">
📄 Kéo thả file hoặc click để chọn
<input type="file" id="fileInput" style="display:none" accept=".txt,.js,.html,.css,.json,.py,.java,.go,.rs,.c,.cpp,.sh">
</div>

<div class="form-row">
<div class="form-group"><label>📌 Tiêu đề</label><input id="titleInput" placeholder="Tên script..."></div>
<div class="form-group"><label>🏷️ Tag</label><input id="tagsInput" placeholder="javascript, demo"></div>
</div>

<div class="form-group"><label>📝 Nội dung</label><textarea id="contentInput" placeholder="Paste code hoặc text..."></textarea></div>

<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px">
<button class="btn btn-primary" id="createBtn">🚀 Tạo Script</button>
<button class="btn btn-outline" id="clearBtn">🗑 Xóa</button>
</div>

<div class="result-box" id="resultBox">
<h3>✅ Tạo thành công!</h3>
<div class="link">
<input type="text" id="resultLink" readonly>
<button class="btn btn-success" id="copyLinkBtn">📋 Copy</button>
<button class="btn btn-outline" id="openRawBtn">🔗 Mở Raw</button>
</div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL = window.location.origin + '/api';
let currentId = null;

function toast(msg, isError = false) {
const el = document.getElementById('toast');
el.textContent = msg;
el.style.borderColor = isError ? '#da3633' : 'var(--border)';
el.classList.add('show');
clearTimeout(el._timer);
el._timer = setTimeout(() => el.classList.remove('show'), 3000);
}

async function createScript() {
const title = document.getElementById('titleInput').value.trim();
const tags = document.getElementById('tagsInput').value.trim();
const content = document.getElementById('contentInput').value.trim();

if (!title) { toast('⚠️ Vui lòng nhập tiêu đề', true); return; }
if (!content) { toast('⚠️ Vui lòng nhập nội dung', true); return; }

const btn = document.getElementById('createBtn');
btn.innerHTML = '<span class="spinner"></span> Đang tạo...';
btn.disabled = true;

try {
const res = await fetch(API_URL + '/create', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ title, tags, content })
});
const data = await res.json();
if (!res.ok) throw new Error(data.error || 'Lỗi server');

currentId = data.id;
const link = window.location.origin + '/raw/' + data.id;
document.getElementById('resultLink').value = link;
document.getElementById('resultBox').classList.add('active');
toast('✅ Tạo thành công! ID: ' + data.id);
} catch(err) {
toast('❌ Lỗi: ' + err.message, true);
} finally {
btn.innerHTML = '🚀 Tạo Script';
btn.disabled = false;
}
}

document.getElementById('createBtn').addEventListener('click', createScript);

document.getElementById('copyLinkBtn').addEventListener('click', () => {
const input = document.getElementById('resultLink');
input.select();
if (navigator.clipboard) {
navigator.clipboard.writeText(input.value).then(() => toast('📋 Đã copy link'));
} else {
document.execCommand('copy');
toast('📋 Đã copy link');
}
});

document.getElementById('openRawBtn').addEventListener('click', () => {
if (currentId) window.open('/raw/' + currentId, '_blank');
});

document.getElementById('clearBtn').addEventListener('click', () => {
document.getElementById('titleInput').value = '';
document.getElementById('tagsInput').value = '';
document.getElementById('contentInput').value = '';
document.getElementById('resultBox').classList.remove('active');
currentId = null;
});

const uploadArea = document.getElementById('uploadArea');
const fileInput = document.getElementById('fileInput');

uploadArea.addEventListener('click', () => fileInput.click());

uploadArea.addEventListener('dragover', (e) => {
e.preventDefault();
uploadArea.classList.add('dragover');
});

uploadArea.addEventListener('dragleave', () => {
uploadArea.classList.remove('dragover');
});

uploadArea.addEventListener('drop', (e) => {
e.preventDefault();
uploadArea.classList.remove('dragover');
const file = e.dataTransfer.files[0];
if (file) handleFile(file);
});

fileInput.addEventListener('change', (e) => {
if (e.target.files[0]) handleFile(e.target.files[0]);
});

function handleFile(file) {
const reader = new FileReader();
reader.onload = (e) => {
document.getElementById('contentInput').value = e.target.result;
document.getElementById('titleInput').value = file.name.replace(/\.[^.]+$/, '');
toast('📄 Đã tải file: ' + file.name);
};
reader.readAsText(file);
}

document.getElementById('themeToggle').addEventListener('click', () => {
const root = document.documentElement;
const cur = root.style.getPropertyValue('--bg') === '#0d1117' ? 'light' : 'dark';
if (cur === 'dark') {
root.style.setProperty('--bg', '#f6f8fa');
root.style.setProperty('--surface', '#ffffff');
root.style.setProperty('--border', '#d0d7de');
root.style.setProperty('--text', '#24292f');
} else {
root.style.setProperty('--bg', '#0d1117');
root.style.setProperty('--surface', '#161b22');
root.style.setProperty('--border', '#30363d');
root.style.setProperty('--text', '#c9d1d9');
}
});
</script>
  <script src="server.js"></script>
</body>
  </html>
